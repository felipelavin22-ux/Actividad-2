<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="contactoEstilos.css">
</head>
<body>
    <header>
         <nav>
            <a href="index.html">HOME</a>
            <span>|</span><!--Utilizamos span porque es un contenedor que no tiene significado semántico-->
            <a href="contacto.html">CONTACTO</a>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <form action="#" method="post">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">Tel:</label>
                <input type="tel" id="telefono" name="telefono" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea><!--El textarea permite ingresar múltiples líneas de texto-->

                
                <button type="submit">Enviar</button>
                <button type="reset">Cancelar</button>
                
            </form>
        </section>
    </main>

    <footer>
        <p>Todos los derechos reservados.</p>
    </footer>
</body>
</html>
